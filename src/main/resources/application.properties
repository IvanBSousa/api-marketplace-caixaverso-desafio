# config para o spring ler o arquivo .env, sem precisar de instalar lib!
spring.config.import=optional:file:.env[.properties]
spring.application.name=marketplace-desafio-api
server.port=${SERVER_PORT:8082}

# Conexão local padrão. Para Supabase ou outro PostgreSQL, substitua as três
# variáveis de ambiente sem alterar este arquivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.qyvuxgmowewpzeygdaed}
spring.datasource.password=${DB_PASSWORD:GuiLivia*01}

# Configuração didática. As entidades podem criar ou atualizar as tabelas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger e OpenAPI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# BCrypt e JWT.
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
security.jwt.secret=${JWT_SECRET:c2VncmVkby1qd3QtZGlkYXRpY28tMzItYnl0ZXMtMTIzNDU2Nzg=}
security.jwt.issuer=${JWT_ISSUER:marketplace-desafio-api}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

server.error.include-message=always
